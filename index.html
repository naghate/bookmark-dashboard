<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Bookmark Dashboard</title>

<style>

body{
font-family:Arial;
margin:20px;
background:#f4f6fb;
}

#toolbar{
margin-bottom:15px;
}

button{
margin-right:5px;
padding:6px 10px;
}

#search{
padding:6px;
width:200px;
}

.folder{
font-weight:bold;
cursor:pointer;
margin-top:10px;
}

.bookmark{
margin-left:25px;
margin-top:5px;
}

.bookmark img{
width:16px;
margin-right:6px;
vertical-align:middle;
}

.hidden{
display:none;
}

</style>
</head>

<body>

<h2>Bookmark Dashboard</h2>

<div id="toolbar">

<button onclick="addFolder()">Add Folder</button>
<button onclick="addBookmark()">Add Bookmark</button>
<button onclick="exportBookmarks()">Export</button>

<input id="search" placeholder="Search..." oninput="searchBookmarks()">

</div>

<div id="tree"></div>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

<script>

/* PUT YOUR FIREBASE CONFIG HERE */

const firebaseConfig={
apiKey:"AIzaSyBMPgm00jLjptTgGRkiFsPZqk6iaRcY0oE",
authDomain:"bookmark-dashboard-nag.firebaseapp.com",
projectId:"bookmark-dashboard-nag"
}

firebase.initializeApp(firebaseConfig)

const db=firebase.firestore()

let data=[]


function fixUrl(url){

if(!url.startsWith("http://") && !url.startsWith("https://")){
return "https://"+url
}

return url
}


function favicon(url){

try{
return "https://www.google.com/s2/favicons?domain="+(new URL(url)).hostname
}catch{
return ""
}

}


async function loadBookmarks(){

let doc=await db.collection("bookmarks").doc("main").get()

if(doc.exists){

data=doc.data().items

}else{

data=[
{
name:"Work",
children:[
{name:"Gmail",url:"https://mail.google.com"},
{name:"Drive",url:"https://drive.google.com"}
]
},
{
name:"Tools",
children:[
{name:"ChatGPT",url:"https://chat.openai.com"},
{name:"GitHub",url:"https://github.com"}
]
}
]

saveBookmarks()

}

render()

}


async function saveBookmarks(){

await db.collection("bookmarks").doc("main").set({
items:data
})

}


function render(){

const tree=document.getElementById("tree")

tree.innerHTML=""

data.forEach((folder,fIndex)=>{

let folderDiv=document.createElement("div")

folderDiv.className="folder"

folderDiv.innerHTML="📁 "+folder.name

let children=document.createElement("div")

children.className="hidden"

folderDiv.onclick=()=>{
children.classList.toggle("hidden")
}

folder.children.forEach((b,bIndex)=>{

let row=document.createElement("div")

row.className="bookmark"

let icon=document.createElement("img")

icon.src=favicon(b.url)

let link=document.createElement("a")

link.href=b.url

link.target="_blank"

link.textContent=b.name

row.appendChild(icon)

row.appendChild(link)

children.appendChild(row)

})

tree.appendChild(folderDiv)

tree.appendChild(children)

})

}


async function addFolder(){

let name=prompt("Folder name")

if(!name)return

data.push({
name:name,
children:[]
})

await saveBookmarks()

render()

}


async function addBookmark(){

if(data.length===0){
alert("Create a folder first")
return
}

let folderNames=data.map((f,i)=>i+" : "+f.name).join("\n")

let folderIndex=prompt("Select folder:\n"+folderNames)

let name=prompt("Bookmark name")

let url=prompt("URL")

if(!name||!url)return

url=fixUrl(url)

data[folderIndex].children.push({
name:name,
url:url
})

await saveBookmarks()

render()

}


function searchBookmarks(){

let term=document.getElementById("search").value.toLowerCase()

document.querySelectorAll(".bookmark").forEach(b=>{

let text=b.innerText.toLowerCase()

b.style.display=text.includes(term)?"block":"none"

})

}


function exportBookmarks(){

let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"})

let a=document.createElement("a")

a.href=URL.createObjectURL(blob)

a.download="bookmarks.json"

a.click()

}


loadBookmarks()

</script>

</body>
</html>
