<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Bookmark Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 12px;
            margin: 8px;
            background: linear-gradient(135deg, #e0e7ff, #f8fafc);
            min-height: 100vh;
        }

        #toolbar {
            margin-bottom: 10px;
            padding: 6px;
            background: rgba(255,255,255,0.6);
            border-radius: 6px;
            backdrop-filter: blur(4px);
        }

        button {
            font-size: 11px;
            padding: 3px 8px;
            margin-right: 3px;
            cursor: pointer;
            border: none;
            border-radius: 4px;

            background: #6366f1;
            color: white;

            transition: 0.2s;
        }

        button:hover {
            background: #4f46e5;
        }

        #search {
            font-size: 11px;
            padding: 2px;
            width: 140px;
        }

        .folder {
            font-weight: bold;
            cursor: pointer;
            margin-top: 3px;
            padding: 4px 6px;
            border-radius: 4px;
            transition: all 0.15s ease;
        }

        .folder:hover {
            background: rgba(99, 102, 241, 0.15);
        }
        .folder, .bookmark {
            transition: background 0.2s ease, transform 0.1s ease;
        }

        .folder:active, .bookmark:active {
            transform: scale(0.98);
        }

        .bookmark {
            margin-left: 16px;
            margin-top: 2px;
            padding: 2px 4px;
            border-radius: 3px;
            transition: all 0.15s ease;
        }

        .bookmark:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        .bookmark img {
            width: 10px;
            height: 10px;
            margin-right: 4px;
            vertical-align: middle;
        }

        .hidden {
            display: none;
        }

        #inputPanel {
            background: #eef2ff;
            padding: 6px;
            border-radius: 4px;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <h2>Bookmark Dashboard</h2>

    <div id="toolbar">

        <button onclick="addFolder()">Add Folder</button>
        <button onclick="addBookmark()">Add Bookmark</button>
        <button onclick="exportBookmarks()">Export</button>

        <input id="search" placeholder="Search">

        <button onclick="performSearch()">Search</button>
        <button onclick="prevResult()">Prev</button>
        <button onclick="nextResult()">Next</button>

        <input type="file" id="importFile" accept=".html" style="display:none">
        <button onclick="triggerImport()">Import</button>
    </div>

    <div id="inputPanel" style="display:none;margin-bottom:8px">
        Name:
        <input id="bmName" size="15">
        URL:
        <input id="bmUrl" size="25">
        <button onclick="saveBookmarkInput()">Save</button>
        <button onclick="cancelInput()">Cancel</button>
    </div>
    <div id="folderPanel" style="display:none;margin-bottom:8px;background:#eef2ff;padding:6px;border-radius:4px">
        Folder Name:
        <input id="folderName" size="20">
        <button onclick="saveFolderInput()">Create</button>
        <button onclick="cancelFolderInput()">Cancel</button>
    </div>

    <div id="tree"></div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

    <script>

        const firebaseConfig = {
            apiKey: "AIzaSyBMPgm00jLjptTgGRkiFsPZqk6iaRcY0oE",
            authDomain: "bookmark-dashboard-nag.firebaseapp.com",
            projectId: "bookmark-dashboard-nag"
        }

        firebase.initializeApp(firebaseConfig)
        const db = firebase.firestore()

        let data = []
        let activeFolder = null
        let searchResults = []
        let currentSearchIndex = 0
        let editItem = null


        function fixUrl(url) {

            if (!url.startsWith("http://") && !url.startsWith("https://")) {
                return "https://" + url
            }

            return url
        }

        function favicon(url) {
            try {
                return "https://www.google.com/s2/favicons?domain=" + (new URL(url)).hostname
            } catch {
                return ""
            }

        }


        async function loadBookmarks() {

            let doc = await db.collection("bookmarks").doc("main").get()

            if (doc.exists) {

                data = doc.data().items

            } else {

                data = [
                    {
                        name: "Work",
                        children: [
                            { name: "Gmail", url: "https://mail.google.com" },
                            { name: "Drive", url: "https://drive.google.com" }
                        ]
                    },
                    {
                        name: "Tools",
                        children: [
                            { name: "ChatGPT", url: "https://chat.openai.com" },
                            { name: "GitHub", url: "https://github.com" }
                        ]
                    }
                ]

                saveBookmarks()

            }
            function normalize(items) {
                items.forEach(item => {
                    if (item.children) {
                        if (item.open === undefined) item.open = false
                        normalize(item.children)
                    }
                })
            }
            normalize(data)
            render()

        }


        async function saveBookmarks() {

            await db.collection("bookmarks").doc("main").set({
                items: data
            })

        }

        function render() {
            const tree = document.getElementById("tree")
            tree.innerHTML = ""

            function renderItems(items, parentDiv) {
                items.forEach((item, index) => {

                    // -------- FOLDER --------
                    if (item.children) {

                        let folderDiv = document.createElement("div")
                        folderDiv.className = "folder"

                        let arrow = document.createElement("span")
                        arrow.textContent = item.open ? "▼" : "▶"

                        let name = document.createElement("span")

                        if (editItem === item) {

                            let input = document.createElement("input")
                            input.value = item.name
                            input.style.fontSize = "11px"

                            input.onblur = async () => {
                                item.name = input.value || item.name
                                editItem = null
                                await saveBookmarks()
                                render()
                            }

                            input.onkeydown = async (e) => {
                                if (e.key === "Enter") {
                                    input.blur()
                                }
                            }
                            setTimeout(() => input.focus(), 0)
                            name.appendChild(input)

                        } else {

                            name.textContent = " 📁 " + item.name

                            // double-click to edit
                            name.ondblclick = (e) => {
                                e.stopPropagation()
                                editItem = item
                                render()
                            }
                        }

                        folderDiv.appendChild(arrow)
                        folderDiv.appendChild(name)
                        folderDiv.onclick = (e) => {
                            if (["BUTTON", "INPUT"].includes(e.target.tagName)) return
                        }
                        if (activeFolder === item) {
                            folderDiv.style.background = "#dbeafe"
                            folderDiv.style.border = "1px solid #6366f1"
                        } else {
                            folderDiv.style.border = "none"
                        }
                        let editBtn = document.createElement("button")
                        editBtn.textContent = "✏"
                        editBtn.style.marginLeft = "6px"

                        editBtn.onclick = (e) => {
                            e.stopPropagation()
                            editItem = item
                            render()
                        }

                        folderDiv.appendChild(editBtn)

                        // delete only if empty
                        if (item.children.length === 0) {
                            let del = document.createElement("button")
                            del.textContent = "🗑"
                            del.style.marginLeft = "6px"

                            del.onclick = async (e) => {
                                e.stopPropagation()
                                items.splice(index, 1)
                                await saveBookmarks()
                                render()
                            }

                            folderDiv.appendChild(del)
                        }

                        // toggle open                        
                        folderDiv.onclick = async (e) => {

                            if (["BUTTON", "INPUT"].includes(e.target.tagName)) return

                            // click arrow = toggle only
                            if (e.target === arrow) {
                                item.open = !item.open
                            } else {
                                // click elsewhere = select + toggle
                                activeFolder = item
                                item.open = !item.open
                            }

                            await saveBookmarks()
                            render()
                        }

                        name.onclick = (e) => {
                            e.stopPropagation()
                            activeFolder = item
                            render()
                        }

                        parentDiv.appendChild(folderDiv)

                        // children container
                        let childrenDiv = document.createElement("div")
                        childrenDiv.style.marginLeft = "16px"
                        childrenDiv.className = item.open ? "" : "hidden"

                        parentDiv.appendChild(childrenDiv)
                        // RECURSION
                        renderItems(item.children, childrenDiv)

                        // show empty ONLY if no children rendered
                        if (item.children.length === 0) {
                            let empty = document.createElement("div")
                            empty.textContent = "(empty)"
                            empty.style.fontSize = "10px"
                            empty.style.opacity = "0.6"
                            empty.style.marginLeft = "16px"
                            childrenDiv.appendChild(empty)
                        }
                    }

                    // -------- BOOKMARK --------
                    else {

                        let row = document.createElement("div")
                        row.className = "bookmark"

                        let content = document.createElement("div")

                        if (editItem === item) {

                            let nameInput = document.createElement("input")
                            
                            nameInput.value = item.name
                            nameInput.placeholder = "Name"
                            nameInput.style.fontSize = "11px"

                            let urlInput = document.createElement("input")
                            urlInput.value = item.url
                            urlInput.placeholder = "URL"
                            urlInput.style.fontSize = "11px"
                            urlInput.style.marginLeft = "4px"

                            let save = document.createElement("button")
                            save.textContent = "✔"

                            save.onclick = async (e) => {
                                e.stopPropagation()
                                item.name = nameInput.value || item.name
                                item.url = fixUrl(urlInput.value || item.url)
                                editItem = null
                                await saveBookmarks()
                                render()
                            }

                            content.appendChild(nameInput)
                            content.appendChild(urlInput)
                            content.appendChild(save)

                        } else {

                            let icon = document.createElement("img")
                            icon.src = favicon(item.url)

                            let link = document.createElement("a")
                            link.href = item.url
                            link.target = "_blank"
                            link.textContent = item.name

                            // double-click to edit
                            link.ondblclick = (e) => {
                                e.preventDefault()
                                e.stopPropagation()
                                editItem = item
                                render()
                            }

                            content.appendChild(icon)
                            content.appendChild(link)
                        }

                        let del = document.createElement("button")
                        del.textContent = "❌"
                        del.style.marginLeft = "8px"

                        del.onclick = async (e) => {
                            e.stopPropagation()
                            items.splice(index, 1)
                            await saveBookmarks()
                            render()
                        }

                        row.appendChild(content)
                        let editBtn = document.createElement("button")
                        editBtn.textContent = "✏"
                        editBtn.style.marginLeft = "6px"

                        editBtn.onclick = (e) => {
                            e.stopPropagation()
                            editItem = item
                            render()
                        }

                        row.appendChild(editBtn)
                        row.appendChild(del)

                        parentDiv.appendChild(row)
                    }

                })
            }

            renderItems(data, tree)
        }


        async function saveFolderInput() {
            let name = document.getElementById("folderName").value
            if (!name) return

            let newFolder = {
                name: name,
                open: false,
                children: []
            }

            if (activeFolder) {
                activeFolder.children.push(newFolder)
            } else {
                data.push(newFolder)
            }

            await saveBookmarks()
            document.getElementById("folderPanel").style.display = "none"
            render()
        }
        async function addFolder() {
            document.getElementById("folderName").value = ""
            document.getElementById("folderPanel").style.display = "block"
        }
        function cancelFolderInput() {
            document.getElementById("folderPanel").style.display = "none"
        }

        async function addBookmark() {
            if (!activeFolder) {
                alert("Select a folder first")
                return
            }
            document.getElementById("bmName").value = ""
            document.getElementById("bmUrl").value = ""
            document.getElementById("inputPanel").style.display = "block"
        }

        async function saveBookmarkInput() {
            let name = document.getElementById("bmName").value
            let url = document.getElementById("bmUrl").value
            if (!name || !url || !activeFolder) return
            url = fixUrl(url)
            activeFolder.children.push({
                name: name,
                url: url
            })
            await saveBookmarks()
            document.getElementById("inputPanel").style.display = "none"
            render()
        }

        function cancelInput() {

            document.getElementById("inputPanel").style.display = "none"

        }
        
        function performSearch() {

            let term = document.getElementById("search").value.toLowerCase()

            searchResults = []

            function searchRecursive(items, path = []) {
                items.forEach((item, index) => {

                    if (item.children) {
                        searchRecursive(item.children, [...path, item])
                    } else {
                        if (
                            item.name.toLowerCase().includes(term) ||
                            item.url.toLowerCase().includes(term)
                        ) {
                            searchResults.push({ item, path })
                        }
                    }

                })
            }

            searchRecursive(data)

            currentSearchIndex = 0
            highlightSearchResult()
        }


        function highlightSearchResult() {

            if (searchResults.length === 0) return

            let result = searchResults[currentSearchIndex]

            // Open all parent folders
            result.path.forEach(folder => {
                folder.open = true
            })

            render()

            // Highlight the found item
            setTimeout(() => {
                let links = document.querySelectorAll(".bookmark a")

                links.forEach(link => {
                    if (link.href === result.item.url) {
                        link.parentElement.style.background = "#fde68a"
                        link.scrollIntoView({ behavior: "smooth", block: "center" })
                    }
                })
            }, 100)
        }


        function nextResult() {

            if (searchResults.length === 0) return

            currentSearchIndex++

            if (currentSearchIndex >= searchResults.length) {
                currentSearchIndex = 0
            }

            highlightSearchResult()

        }


        function prevResult() {

            if (searchResults.length === 0) return

            currentSearchIndex--

            if (currentSearchIndex < 0) {
                currentSearchIndex = searchResults.length - 1
            }

            highlightSearchResult()

        }

        function triggerImport() {
            document.getElementById("importFile").click()
        }

        function parseBookmarkHTML(html) {

            let parser = new DOMParser()
            let doc = parser.parseFromString(html, "text/html")

            function parseDL(dl) {
                let items = []

                let children = dl.children

                for (let i = 0; i < children.length; i++) {

                    let node = children[i]

                    if (node.tagName === "DT") {

                        let h3 = node.querySelector("h3")
                        let a = node.querySelector("a")

                        // -------- FOLDER --------
                        if (h3) {

                            let nextDL = node.nextElementSibling

                            let folder = {
                                name: h3.textContent,
                                open: false,
                                children: []
                            }

                            if (nextDL && nextDL.tagName === "DL") {
                                folder.children = parseDL(nextDL)
                            }

                            items.push(folder)
                        }

                        // -------- BOOKMARK --------
                        else if (a) {

                            items.push({
                                name: a.textContent,
                                url: a.href
                            })
                        }
                    }
                }

                return items
            }

            let rootDL = doc.querySelector("DL")

            if (!rootDL) return []

            return parseDL(rootDL)
        }

        async function handleImport(event) {

            let file = event.target.files[0]
            if (!file) return

            let text = await file.text()

            let importedData = parseBookmarkHTML(text)

            if (importedData.length === 0) {
                alert("Invalid bookmark file")
                return
            }

            // OPTION: merge into active folder or root
            if (activeFolder) {
                activeFolder.children.push(...importedData)
            } else {
                data.push(...importedData)
            }
            activeFolder = null
            await saveBookmarks()

            render()

            // reset input so same file can be re-imported
            event.target.value = ""
        }
        function exportBookmarks() {

            let dataStr = JSON.stringify(data, null, 2)
            let blob = new Blob([dataStr], { type: "application/json" })
            let a = document.createElement("a")
            a.href = URL.createObjectURL(blob)
            a.download = "bookmarks.json"
            a.click()
        }
        document.getElementById("folderName").addEventListener("keypress", function (e) {
            if (e.key === "Enter") {
                saveFolderInput()
            }
        })
        document.getElementById("bmName").addEventListener("keypress", function (e) {
            if (e.key === "Enter") {
                saveBookmarkInput()
            }
        })
        document.getElementById("bmUrl").addEventListener("keypress", function (e) {
            if (e.key === "Enter") {
                saveBookmarkInput()
            }
        })
        document.addEventListener("keydown", function (e) {
            if (e.key === "Escape") {
                document.getElementById("inputPanel").style.display = "none"
                document.getElementById("folderPanel").style.display = "none"
            }
        })
        document.getElementById("importFile").addEventListener("change", handleImport)
        loadBookmarks()

    </script>

</body>

</html>
