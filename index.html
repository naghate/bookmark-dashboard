<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Bookmark Dashboard</title>

<style>
body{
font-family:Arial;
font-size:13px;
margin:10px;
background:#f4f6fb;
}

#toolbar{
margin-bottom:10px;
}

button{
margin-right:4px;
padding:3px 6px;
font-size:12px;
}

#search{
padding:3px;
width:150px;
font-size:12px;
}

.folder{
font-weight:bold;
cursor:pointer;
margin-top:4px;
padding:2px 4px;
}

.bookmark{
margin-left:18px;
margin-top:2px;
line-height:1.2;
}

.bookmark img{
width:12px;
height:12px;
margin-right:4px;
vertical-align:middle;
}

.hidden{
display:none;
}

</style>
</head>

<body>

<h2>Bookmark Dashboard</h2>

<div id="toolbar">

<button onclick="addFolder()">Add Folder</button>
<button onclick="addBookmark()">Add Bookmark</button>
<button onclick="exportBookmarks()">Export</button>

<input id="search" placeholder="Search">

<button onclick="performSearch()">Search</button>
<button onclick="prevResult()">Prev</button>
<button onclick="nextResult()">Next</button>
</div>

<div id="tree"></div>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

<script>

const firebaseConfig={
apiKey:"AIzaSyBMPgm00jLjptTgGRkiFsPZqk6iaRcY0oE",
authDomain:"bookmark-dashboard-nag.firebaseapp.com",
projectId:"bookmark-dashboard-nag"
}

firebase.initializeApp(firebaseConfig)
const db=firebase.firestore()

let data=[]
let activeFolderIndex=null
let searchResults=[]
let currentSearchIndex=0


function fixUrl(url){

if(!url.startsWith("http://") && !url.startsWith("https://")){
return "https://"+url
}

return url
}


function favicon(url){

try{
return "https://www.google.com/s2/favicons?domain="+(new URL(url)).hostname
}catch{
return ""
}

}


async function loadBookmarks(){

let doc=await db.collection("bookmarks").doc("main").get()

if(doc.exists){

data=doc.data().items

}else{

data=[
{
name:"Work",
children:[
{name:"Gmail",url:"https://mail.google.com"},
{name:"Drive",url:"https://drive.google.com"}
]
},
{
name:"Tools",
children:[
{name:"ChatGPT",url:"https://chat.openai.com"},
{name:"GitHub",url:"https://github.com"}
]
}
]

saveBookmarks()

}

render()

}


async function saveBookmarks(){

await db.collection("bookmarks").doc("main").set({
items:data
})

}


function render(){

const tree=document.getElementById("tree")

tree.innerHTML=""

data.forEach((folder,fIndex)=>{

let folderDiv=document.createElement("div")
folderDiv.className="folder"
folderDiv.innerHTML="📁 "+folder.name

if(activeFolderIndex===fIndex){
folderDiv.style.background="#dbeafe"
}

let children=document.createElement("div")
children.className="hidden"

folderDiv.onclick=()=>{

activeFolderIndex=fIndex

if(children.classList.contains("hidden")){
children.classList.remove("hidden")
}else{
children.classList.add("hidden")
}

renderHighlight()

}

folder.children.forEach((b,bIndex)=>{

let row=document.createElement("div")
row.className="bookmark"

let icon=document.createElement("img")
icon.src=favicon(b.url)

let link=document.createElement("a")
link.href=b.url
link.target="_blank"
link.textContent=b.name

let del=document.createElement("button")
del.textContent="❌"
del.style.marginLeft="8px"

del.onclick=async(e)=>{

e.stopPropagation()

if(confirm("Delete bookmark?")){

data[fIndex].children.splice(bIndex,1)

await saveBookmarks()

render()

}

}

row.appendChild(icon)
row.appendChild(link)
row.appendChild(del)

children.appendChild(row)

})

tree.appendChild(folderDiv)
tree.appendChild(children)

})

renderHighlight()

}

function renderHighlight(){

const folders=document.querySelectorAll(".folder")

folders.forEach((f,i)=>{

if(i===activeFolderIndex){
f.style.background="#dbeafe"
}else{
f.style.background=""
}

})

}

const tree=document.getElementById("tree")

tree.innerHTML=""

data.forEach((folder,fIndex)=>{

let folderDiv=document.createElement("div")

folderDiv.className="folder"

folderDiv.innerHTML="📁 "+folder.name

if(activeFolderIndex===fIndex){
folderDiv.style.background="#dbeafe"
}

let children=document.createElement("div")
children.className="hidden"

folderDiv.onclick=()=>{

activeFolderIndex=fIndex
render()

}

folder.children.forEach((b,bIndex)=>{

let row=document.createElement("div")
row.className="bookmark"

let icon=document.createElement("img")
icon.src=favicon(b.url)

let link=document.createElement("a")
link.href=b.url
link.target="_blank"
link.textContent=b.name

let del=document.createElement("button")
del.textContent="❌"
del.style.marginLeft="8px"

del.onclick=async(e)=>{

e.stopPropagation()

if(confirm("Delete bookmark?")){

data[fIndex].children.splice(bIndex,1)

await saveBookmarks()

render()

}

}

row.appendChild(icon)
row.appendChild(link)
row.appendChild(del)

children.appendChild(row)

})

tree.appendChild(folderDiv)
tree.appendChild(children)

})

async function addFolder(){

let name=prompt("Folder name")

if(!name)return

data.push({
name:name,
children:[]
})

await saveBookmarks()
render()

}


async function addBookmark(){

if(activeFolderIndex===null){

alert("Select a folder first")

return

}

let name=prompt("Bookmark name")

let url=prompt("URL")

if(!name||!url)return

url=fixUrl(url)

data[activeFolderIndex].children.push({
name:name,
url:url
})

await saveBookmarks()
render()

}


function performSearch(){

let term=document.getElementById("search").value.toLowerCase()

searchResults=[]

data.forEach((folder,fIndex)=>{

folder.children.forEach((b,bIndex)=>{

if(b.name.toLowerCase().includes(term) ||
b.url.toLowerCase().includes(term)){

searchResults.push({fIndex,bIndex})

}

})

})

currentSearchIndex=0

highlightSearchResult()

}


function highlightSearchResult(){

if(searchResults.length===0) return

let result=searchResults[currentSearchIndex]

activeFolderIndex=result.fIndex

render()

let tree=document.getElementById("tree")

let children=tree.children[result.fIndex*2+1]

children.classList.remove("hidden")

let bookmark=children.children[result.bIndex]

bookmark.style.background="#fde68a"

}


function nextResult(){

if(searchResults.length===0) return

currentSearchIndex++

if(currentSearchIndex>=searchResults.length){
currentSearchIndex=0
}

highlightSearchResult()

}


function prevResult(){

if(searchResults.length===0) return

currentSearchIndex--

if(currentSearchIndex<0){
currentSearchIndex=searchResults.length-1
}

highlightSearchResult()

}


loadBookmarks()

</script>
</body>
</html>
